name: Docker

on:
  push:
    branches: [main, master, beta]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  PROJECTNAME: ytdl
  REGISTRY: ghcr.io/casapps/ytdl

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +"%a %b %d, %Y at %H:%M:%S %Z")" >> $GITHUB_ENV
          if [ -f site.txt ]; then
            echo "OFFICIALSITE=$(cat site.txt)" >> $GITHUB_ENV
          fi

      - name: Determine tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}:devel,${{ env.REGISTRY }}:${{ env.COMMIT_ID }}"
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == "beta" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}:beta"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${REF#v}"
            YYMM=$(date +%y%m)
            TAGS="${{ env.REGISTRY }}:${VERSION},${{ env.REGISTRY }}:latest,${{ env.REGISTRY }}:${YYMM},${{ env.REGISTRY }}:${{ env.COMMIT_ID }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ env.COMMIT_ID }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIALSITE=${{ env.OFFICIALSITE }}
