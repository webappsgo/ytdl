<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytdl - Admin Dashboard</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border);
               padding: 1rem 0; flex-shrink: 0; overflow-y: auto; }
    .sidebar__logo { padding: 0 1rem 1rem; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .sidebar__section { margin-bottom: 1rem; }
    .sidebar__section-title { padding: 0.5rem 1rem; font-size: 0.75rem; text-transform: uppercase;
                              letter-spacing: 0.05em; color: var(--text-muted); }
    .sidebar__item { display: block; padding: 0.5rem 1rem; color: var(--text-secondary);
                     text-decoration: none; font-size: 0.9rem; }
    .sidebar__item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar__item--active { background: var(--bg-hover); color: var(--accent); border-right: 2px solid var(--accent); }
    .content { flex: 1; padding: 2rem; overflow-y: auto; }
    .content__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .content__title { font-size: 1.5rem; font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); text-align: center;
            box-shadow: 0 1px 4px var(--shadow); }
    .stat__value { font-size: 2rem; font-weight: bold; color: var(--accent); }
    .stat__label { color: var(--text-secondary); margin-top: 0.25rem; font-size: 0.9rem; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar navigation per PART 17 -->
    <nav class="sidebar">
      <div class="sidebar__logo">ytdl Admin</div>
      {{range .Sections}}
      <div class="sidebar__section">
        <div class="sidebar__section-title">{{.Name}}</div>
        {{range .Items}}
        <a class="sidebar__item" href="{{.Path}}">{{.Name}}</a>
        {{end}}
      </div>
      {{end}}
      <div class="sidebar__section">
        <div class="sidebar__section-title">Account</div>
        <a class="sidebar__item" href="/auth/logout">Logout</a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="content">
      <div class="content__header">
        <h1 class="content__title">Dashboard</h1>
        <span class="text-muted">{{.Version}}</span>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat__value" id="total">-</div>
          <div class="stat__label">Total Downloads</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="active">-</div>
          <div class="stat__label">Active</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="queued">-</div>
          <div class="stat__label">Queued</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="completed">-</div>
          <div class="stat__label">Completed</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="failed">-</div>
          <div class="stat__label">Failed</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="storage">-</div>
          <div class="stat__label">Storage Used</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadStats() {
      try {
        const resp = await fetch('/api/v1/analytics');
        const data = await resp.json();
        if (data.data) {
          document.getElementById('total').textContent = data.data.total_downloads || 0;
          document.getElementById('completed').textContent = data.data.completed_count || 0;
          document.getElementById('failed').textContent = data.data.failed_count || 0;
          const bytes = data.data.total_size_bytes || 0;
          document.getElementById('storage').textContent = formatSize(bytes);
        }
      } catch(e) {}
      try {
        const resp = await fetch('/api/v1/downloads?status=downloading&per_page=1');
        const data = await resp.json();
        document.getElementById('active').textContent = data.total || 0;
      } catch(e) {}
      try {
        const resp = await fetch('/api/v1/downloads?status=queued&per_page=1');
        const data = await resp.json();
        document.getElementById('queued').textContent = data.total || 0;
      } catch(e) {}
    }
    function formatSize(bytes) {
      if (!bytes) return '0 B';
      var units = ['B','KB','MB','GB','TB'];
      var i = 0, s = bytes;
      while (s >= 1024 && i < units.length-1) { s /= 1024; i++; }
      return s.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
    }
    loadStats();
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
